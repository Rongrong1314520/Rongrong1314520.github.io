<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rongrong1314520 的個人主頁</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --orange: #ff5c00; }
  body { font-family: 'Archivo', 'Noto Sans TC', -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; line-height: 1.8; color: #1a1a1a; background: #f2efe9; }
  .hero { height: 420px; background: linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.55)), url('banner.jpg') center 65% / cover; display: flex; align-items: flex-end; padding: 32px; box-sizing: border-box; }
  .hero h1 { color: #fff; margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  .hero h1 .hl { background: var(--orange); padding: 2px 10px; text-shadow: none; }
  .container { max-width: 680px; margin: 0 auto; padding: 40px 24px 64px; }
  .card { background: #fffdf8; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 28px; margin-top: 32px; }
  .card-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px dotted #e0dcd2; padding-bottom: 12px; margin-bottom: 16px; }
  .num { background: var(--orange); color: #fff; font-weight: 900; font-size: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  .card-head h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
  p { font-size: 17px; }
  a { color: var(--orange); font-weight: 700; }
  .avatar { width: 260px; height: 260px; border-radius: 50%; background: var(--orange); overflow: hidden; margin: 8px auto 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  figcaption { color: #888; font-size: 14px; margin-top: 12px; text-align: center; }
  footer { margin-top: 64px; color: #888; font-size: 14px; text-align: center; }
</style>
</head>
<body>
  <div class="hero">
    <h1>你好，我是 <span class="hl">Rongrong1314520</span></h1>
  </div>
  <div class="container">
    <p>這是我的個人主頁，正在慢慢完善。</p>
    <div class="card">
      <div class="card-head"><span class="num">01</span><h2>關於我</h2></div>
      <p>真理得自由</p>
      <figure style="margin:24px 0 0;">
        <div class="avatar"><img src="photo.png" alt="我的照片"></div>
        <figcaption>我不是一個技術開發者，我只是一個科技愛好者</figcaption>
      </figure>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">02</span><h2>聯繫方式</h2></div>
      <p><a href="https://github.com/Rongrong1314520">GitHub：Rongrong1314520</a></p>
    </div>
    <footer>© 2026 Rongrong1314520</footer>
  </div>
</body>
</html>
