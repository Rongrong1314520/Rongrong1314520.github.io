<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rongrong1314520 的個人主頁</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --orange: #ff5c00; --bg: #f2efe9; --card: #fffdf8; --text: #1a1a1a; --muted: #888; --line: #e0dcd2; }
  body.dark { --bg: #1c1b18; --card: #2a2723; --text: #f0ede6; --muted: #a8a29a; --line: #3d3831; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Archivo', 'Noto Sans TC', -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; line-height: 1.8; color: var(--text); background: var(--bg); }
  .container { max-width: 680px; margin: 0 auto; padding: 24px 24px 64px; }
  .navbar { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 10px 14px; flex-wrap: wrap; }
  .nav-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--orange); overflow: hidden; border: 2px solid #222; flex-shrink: 0; }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  .nav-username { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
  .nav-tab { text-decoration: none; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 4px; }
  .nav-tab-about { background: var(--orange); color: #000; }
  .nav-tab-blog { background: #555; color: #fff; }
  .switch { margin-left: auto; width: 56px; height: 32px; border-radius: 999px; background: var(--orange); border: none; cursor: pointer; position: relative; flex-shrink: 0; box-shadow: inset 0 1px 3px rgba(0,0,0,0.25); }
  .switch .knob { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); transition: transform 0.2s; }
  body.dark .switch .knob { transform: translateX(24px); }
  .greeting { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; margin: 40px 0 0; }
  .hl { background: var(--orange); color: #000; padding: 2px 10px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 28px; margin-top: 32px; }
  .card-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px dotted var(--line); padding-bottom: 12px; margin-bottom: 16px; }
  .num { background: var(--orange); color: #fff; font-weight: 900; font-size: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  .card-head h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
  p { font-size: 17px; }
  a { color: var(--orange); font-weight: 700; }
  .avatar { width: 260px; height: 260px; border-radius: 50%; background: var(--orange); overflow: hidden; margin: 8px auto 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  figcaption { color: var(--muted); font-size: 14px; margin-top: 12px; text-align: center; }
  footer { margin-top: 64px; color: var(--muted); font-size: 14px; text-align: center; }
  @media (max-width: 520px) {
    .nav-username { font-size: 18px; }
    .nav-tab { padding: 8px 12px; font-size: 14px; }
    .greeting { font-size: 28px; }
  }
</style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="nav-avatar"><img src="photo.png" alt="頭像"></div>
      <span class="nav-username">@Rongrong1314520</span>
      <a class="nav-tab nav-tab-about" href="#about">關於</a>
      <a class="nav-tab nav-tab-blog" href="#blog">部落格</a>
      <button class="switch" id="theme-toggle" aria-label="切換深色淺色"><span class="knob"></span></button>
    </nav>
    <h1 class="greeting">妳好！我是 <span class="hl">蟲天子</span></h1>
    <p>這是我的個人主頁，正在慢慢完善。</p>
    <div class="card" id="about">
      <div class="card-head"><span class="num">01</span><h2>關於我</h2></div>
      <p>真理得自由</p>
      <figure style="margin:24px 0 0;">
        <div class="avatar"><img src="photo.png" alt="我的照片"></div>
        <figcaption>我不是一個技術開發者，我只是一個科技愛好者</figcaption>
      </figure>
    </div>
    <div class="card" id="blog">
      <div class="card-head"><span class="num">02</span><h2>部落格</h2></div>
      <p>還沒有文章。</p>
    </div>
    <div class="card" id="contact">
      <div class="card-head"><span class="num">03</span><h2>聯繫方式</h2></div>
      <p><a href="https://github.com/Rongrong1314520">GitHub：Rongrong1314520</a></p>
    </div>
    <footer>© 2026 Rongrong1314520</footer>
  </div>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      if (saved === 'dark') { document.body.classList.add('dark'); }
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var dark = document.body.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
